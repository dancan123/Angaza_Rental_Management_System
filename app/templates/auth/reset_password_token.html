<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - {{ app_name }}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a56db;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: 
                radial-gradient(circle at 15% 20%, rgba(37, 99, 235, 0.22) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(16, 185, 129, 0.18) 0%, transparent 42%),
                radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.12) 0%, transparent 50%),
                linear-gradient(135deg, #0b1120 0%, #0f172a 50%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
        }
        .auth-card {
            max-width: 460px;
            width: 100%;
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .auth-header {
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 2.25rem 2rem 1.75rem;
            text-align: center;
        }
        .auth-body {
            padding: 2rem;
        }
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(26, 86, 219, 0.15);
        }
        .btn-submit {
            background-color: #059669;
            color: white;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-submit:hover {
            background-color: #047857;
            color: white;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success rounded-circle mb-3" style="width: 58px; height: 58px;">
                <i class="bi bi-key-fill fs-2"></i>
            </div>
            <h4 class="fw-bold mb-1">Set New Password</h4>
            <p class="text-muted small mb-0">For user: <strong>{{ user.full_name }}</strong> ({{ user.email }})</p>
        </div>

        <div class="auth-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show small" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.reset_password_with_token', token=token) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">New Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted border-end-0">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" name="password" id="newPassword" class="form-control border-start-0 border-end-0 ps-0" 
                               placeholder="Minimum 6 characters" minlength="6" required autofocus>
                        <button class="btn btn-outline-secondary border-start-0 bg-white text-muted" type="button" id="togglePwdBtn">
                            <i class="bi bi-eye" id="togglePwdIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-muted">Confirm New Password <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted border-end-0">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input type="password" name="confirm_password" id="confirmPassword" class="form-control border-start-0 ps-0" 
                               placeholder="Re-enter password" minlength="6" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-submit w-100 shadow-sm">
                    <i class="bi bi-check-circle-fill me-1"></i> Update Password &amp; Sign In
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center">
                <a href="{{ url_for('auth.login') }}" class="text-decoration-none small text-muted">
                    <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const toggleBtn = document.getElementById('togglePwdBtn');
        const pwdInput = document.getElementById('newPassword');
        const eyeIcon = document.getElementById('togglePwdIcon');
        if (toggleBtn && pwdInput && eyeIcon) {
            toggleBtn.addEventListener('click', function() {
                if (pwdInput.type === 'password') {
                    pwdInput.type = 'text';
                    eyeIcon.classList.replace('bi-eye', 'bi-eye-slash');
                } else {
                    pwdInput.type = 'password';
                    eyeIcon.classList.replace('bi-eye-slash', 'bi-eye');
                }
            });
        }
    </script>
</body>
</html>
