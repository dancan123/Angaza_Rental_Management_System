<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ app_name }}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: {{ sys_settings.get('theme_primary_color', '#1a56db') }};
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            max-width: 440px;
            width: 100%;
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .login-header {
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 2.25rem 2rem 1.75rem;
            text-align: center;
        }
        .login-header img {
            max-height: 52px;
            max-width: 180px;
            object-fit: contain;
            margin-bottom: 1rem;
        }
        .login-body {
            padding: 2rem;
        }
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(26, 86, 219, 0.15);
        }
        .btn-login {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-login:hover {
            background-color: #1e429f;
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            {% if logo_url %}
            <img src="{{ logo_url }}" alt="Company Logo" onerror="this.style.display='none'; document.getElementById('login-fallback-icon').style.display='inline-block';">
            <div id="login-fallback-icon" style="display: none;" class="mb-2">
                <i class="bi bi-buildings-fill text-primary" style="font-size: 3rem;"></i>
            </div>
            {% else %}
            <i class="bi bi-buildings-fill text-primary mb-2" style="font-size: 3rem;"></i>
            {% endif %}
            <h4 class="fw-bold mb-1">{{ app_name }}</h4>
            <p class="text-muted small mb-0">{{ business_name }}</p>
        </div>

        <div class="login-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show small" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">Username or Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted border-end-0">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="e.g. admin or admin@primerent.co.ke" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted border-end-0">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" name="password" id="loginPassword" class="form-control border-start-0 border-end-0 ps-0" placeholder="••••••••" required>
                        <button class="btn btn-outline-secondary border-start-0 bg-white text-muted" type="button" id="togglePasswordBtn" title="Toggle password visibility">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex align-items-center justify-content-between mb-4">
                    <div class="form-check">
                        <input type="checkbox" name="remember" class="form-check-input" id="rememberMe">
                        <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-login w-100 shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
                </button>
            </form>

            <div class="mt-4 pt-3 text-center border-top">
                <span class="text-muted small">Default Admin: <code>admin</code> / <code>AdminPassword2026!</code></span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const pwdInput = document.getElementById('loginPassword');
        const eyeIcon = document.getElementById('togglePasswordIcon');
        if (toggleBtn && pwdInput && eyeIcon) {
            toggleBtn.addEventListener('click', function() {
                if (pwdInput.type === 'password') {
                    pwdInput.type = 'text';
                    eyeIcon.classList.replace('bi-eye', 'bi-eye-slash');
                    eyeIcon.classList.add('text-primary');
                } else {
                    pwdInput.type = 'password';
                    eyeIcon.classList.replace('bi-eye-slash', 'bi-eye');
                    eyeIcon.classList.remove('text-primary');
                }
            });
        }
    </script>
</body>
</html>
