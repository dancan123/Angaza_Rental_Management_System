<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Portal Sign In - {{ app_name }}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .portal-card {
            background: #ffffff;
            border-radius: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            max-width: 440px;
            width: 100%;
            overflow: hidden;
        }
        .portal-header {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            padding: 2.25rem 2rem 1.75rem;
            color: #ffffff;
            text-align: center;
        }
        .portal-body {
            padding: 2rem;
        }
        .form-control:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 0.25rem rgba(16, 185, 129, 0.2);
        }
        .btn-tenant {
            background-color: #10b981;
            border-color: #10b981;
            color: #ffffff;
            font-weight: 600;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease-in-out;
        }
        .btn-tenant:hover {
            background-color: #059669;
            border-color: #059669;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="portal-card">
        <div class="portal-header">
            <div class="d-inline-flex p-3 rounded-circle bg-white bg-opacity-25 mb-3">
                <i class="bi bi-house-door-fill fs-2 text-white"></i>
            </div>
            <h4 class="fw-bold mb-1">Tenant Self-Service Portal</h4>
            <p class="small text-white text-opacity-75 mb-0">{{ business_name }}</p>
        </div>

        <div class="portal-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show small py-2" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                    </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('tenant_portal.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Phone Number or Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-phone"></i></span>
                        <input type="text" name="login_id" class="form-control" placeholder="e.g. +254712345678" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Password / Portal PIN</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" id="tenantPasswordInput" class="form-control" placeholder="Enter your password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" style="border-left: none;">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input type="checkbox" name="remember" class="form-check-input" id="rememberMe">
                        <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                    </div>
                    <a href="{{ url_for('public.vacancies') }}" class="small text-decoration-none text-success">Vacancies Portal</a>
                </div>

                <button type="submit" class="btn btn-tenant w-100 mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to My Account
                </button>

                <div class="text-center">
                    <small class="text-muted">Are you a property manager or caretaker? <a href="{{ url_for('auth.login') }}" class="text-decoration-none">Staff Login</a></small>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passInput = document.getElementById('tenantPasswordInput');
        const icon = document.getElementById('togglePasswordIcon');
        if (toggleBtn && passInput) {
            toggleBtn.addEventListener('click', function() {
                const isPassword = passInput.type === 'password';
                passInput.type = isPassword ? 'text' : 'password';
                icon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
            });
        }
    </script>
</body>
</html>
